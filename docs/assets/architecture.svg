<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare OS deployment architecture</title>
  <desc id="desc">Team members sign in through the deployment's configured authentication method and reach the pinned Cloudflare OS release, which contains the Workshop kernel, Gadgets, and the default Gatekeepers including Context. Service bindings connect it to deployment-owned Workers: an optional AI Gateway, any number of custom Gatekeepers, the Error Reporter, and KV and R2 storage.</desc>
  <style>
    .bg{fill:#f6f8fa}
    .group{fill:#fff;fill-opacity:.5;stroke:#d0d7de;stroke-dasharray:6 4}
    .card{fill:#fff;stroke:#d0d7de}
    .core{fill:#fff;stroke:#f6821f;stroke-width:1.6}
    .stack{fill:#fff;stroke:#d0d7de;opacity:.6}
    .t{fill:#1f2328;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .g{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#656d76;font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .line{fill:none;stroke:#afb8c1;stroke-width:1.5}
    .accent{stroke:#f6821f}
    .pill{fill:#fff1e5;stroke:#f6821f;stroke-opacity:.35}
    .pill-t{fill:#a2551a;font:600 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.6px}
    @media(prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .group{fill:#161b22;fill-opacity:.4;stroke:#30363d}
      .card{fill:#161b22;stroke:#30363d}
      .core{fill:#161b22}
      .stack{fill:#161b22;stroke:#30363d}
      .t,.g{fill:#e6edf3}
      .s{fill:#8b949e}
      .line{stroke:#484f58}
      .pill{fill:#2a1a0c}
      .pill-t{fill:#ffa657}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#afb8c1"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#f6821f"/>
    </marker>
  </defs>

  <rect class="bg" width="1060" height="500" rx="12"/>

  <rect class="card" x="28" y="225" width="140" height="60" rx="8"/>
  <text class="t" x="46" y="260">Team members</text>

  <path class="line" d="M168 255h18" marker-end="url(#a)"/>

  <rect class="card" x="192" y="225" width="176" height="60" rx="8"/>
  <text class="t" x="210" y="250">Sign-in</text>
  <text class="s" x="210" y="268">Access, password, or OAuth</text>

  <path class="line accent" d="M368 255h18" marker-end="url(#ao)"/>

  <rect class="group" x="392" y="48" width="294" height="414" rx="12"/>
  <text class="g" x="412" y="78">Cloudflare OS</text>
  <text class="s" x="412" y="96">Pinned upstream release</text>

  <rect class="core" x="412" y="112" width="254" height="64" rx="8"/>
  <text class="t" x="430" y="140">Workshop kernel</text>
  <text class="s" x="430" y="158">Overseer, policy, and RPC</text>

  <rect class="card" x="412" y="196" width="254" height="64" rx="8"/>
  <text class="t" x="430" y="224">Gadgets</text>
  <text class="s" x="430" y="242">Sandboxed Durable Objects</text>

  <rect class="card" x="412" y="280" width="254" height="64" rx="8"/>
  <text class="t" x="430" y="308">Blueprints</text>
  <text class="s" x="430" y="326">Shareable Gadget templates</text>

  <rect class="stack" x="420" y="372" width="254" height="64" rx="8"/>
  <rect class="stack" x="416" y="368" width="254" height="64" rx="8"/>
  <rect class="card" x="412" y="364" width="254" height="64" rx="8"/>
  <text class="t" x="430" y="392">Default Gatekeepers</text>
  <text class="s" x="430" y="410">Context and the rest of the set</text>

  <path class="line accent" d="M686 255h46" marker-end="url(#ao)"/>

  <rect class="group" x="746" y="48" width="286" height="414" rx="12"/>
  <text class="g" x="766" y="78">Your deployment</text>
  <text class="s" x="766" y="96">Wrapper-owned Workers</text>

  <rect class="card" x="766" y="112" width="246" height="64" rx="8"/>
  <text class="t" x="784" y="140">Workers AI / AI Gateway</text>
  <text class="s" x="784" y="158">Deployment-funded models</text>
  <rect class="pill" x="936" y="122" width="60" height="18" rx="9"/>
  <text class="pill-t" x="966" y="134.5" text-anchor="middle">OPTIONAL</text>

  <rect class="stack" x="774" y="204" width="246" height="64" rx="8"/>
  <rect class="stack" x="770" y="200" width="246" height="64" rx="8"/>
  <rect class="card" x="766" y="196" width="246" height="64" rx="8"/>
  <text class="t" x="784" y="224">Custom Gatekeepers</text>
  <text class="s" x="784" y="242">Your organization's APIs</text>

  <rect class="card" x="766" y="290" width="246" height="64" rx="8"/>
  <text class="t" x="784" y="318">Error Reporter</text>
  <text class="s" x="784" y="336">Workers Logs or your collector</text>

  <rect class="card" x="766" y="374" width="246" height="64" rx="8"/>
  <text class="t" x="784" y="402">KV + R2</text>
  <text class="s" x="784" y="420">Blueprints, avatars, and content</text>
</svg>
