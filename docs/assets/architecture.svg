<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare OS deployment architecture</title>
  <desc id="desc">Team members sign in through the deployment's configured authentication method, then reach the Cloudflare OS Workshop Worker, which connects to optional AI, the Context and custom Gatekeepers, KV and R2 storage, and a private Error Reporter.</desc>
  <style>
    .bg{fill:#f6f8fa}
    .card{fill:#fff;stroke:#d0d7de}
    .core{fill:#fff;stroke:#f6821f;stroke-width:1.6}
    .t{fill:#1f2328;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#656d76;font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .line{fill:none;stroke:#afb8c1;stroke-width:1.5}
    .accent{stroke:#f6821f}
    .pill{fill:#fff1e5;stroke:#f6821f;stroke-opacity:.35}
    .pill-t{fill:#a2551a;font:600 9.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.6px}
    @media(prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .card{fill:#161b22;stroke:#30363d}
      .core{fill:#161b22}
      .t{fill:#e6edf3}
      .s{fill:#8b949e}
      .line{stroke:#484f58}
      .pill{fill:#2a1a0c}
      .pill-t{fill:#ffa657}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#afb8c1"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#f6821f"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="420" rx="12"/>

  <rect class="card" x="40" y="180" width="140" height="60" rx="8"/>
  <text class="t" x="58" y="215">Team members</text>

  <path class="line" d="M180 210h28" marker-end="url(#a)"/>

  <rect class="card" x="210" y="180" width="194" height="60" rx="8"/>
  <text class="t" x="228" y="205">User Auth</text>
  <text class="s" x="228" y="223">Access, password, or OAuth</text>

  <path class="line accent" d="M404 210h34" marker-end="url(#ao)"/>

  <rect class="core" x="440" y="165" width="180" height="90" rx="10"/>
  <text class="t" x="458" y="203">Cloudflare OS</text>
  <text class="s" x="458" y="222">Workshop Worker</text>

  <path class="line" d="M620 210h20M640 66v288"/>
  <path class="line" stroke-dasharray="5 5" d="M640 66h18" marker-end="url(#a)"/>
  <path class="line" d="M640 138h18" marker-end="url(#a)"/>
  <path class="line" d="M640 210h18" marker-end="url(#a)"/>
  <path class="line" d="M640 282h18" marker-end="url(#a)"/>
  <path class="line" d="M640 354h18" marker-end="url(#a)"/>

  <rect class="card" x="660" y="38" width="280" height="56" rx="8"/>
  <text class="t" x="678" y="62">Workers AI / AI Gateway</text>
  <text class="s" x="678" y="80">Deployment-funded models</text>
  <rect class="pill" x="864" y="53" width="60" height="18" rx="9"/>
  <text class="pill-t" x="894" y="65.5" text-anchor="middle">OPTIONAL</text>

  <rect class="card" x="660" y="110" width="280" height="56" rx="8"/>
  <text class="t" x="678" y="134">Context Gatekeeper</text>
  <text class="s" x="678" y="152">Shared context in KV</text>

  <rect class="card" x="660" y="182" width="280" height="56" rx="8"/>
  <text class="t" x="678" y="206">Custom Gatekeeper</text>
  <text class="s" x="678" y="224">Organization APIs and capabilities</text>

  <rect class="card" x="660" y="254" width="280" height="56" rx="8"/>
  <text class="t" x="678" y="278">KV + R2</text>
  <text class="s" x="678" y="296">Blueprints, avatars, and content</text>

  <rect class="card" x="660" y="326" width="280" height="56" rx="8"/>
  <text class="t" x="678" y="350">Error Reporter</text>
  <text class="s" x="678" y="368">Structured logs to Workers Observability</text>
</svg>
